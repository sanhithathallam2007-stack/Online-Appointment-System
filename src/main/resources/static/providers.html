<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Providers - Online Appointment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="app-page">

    <div class="page-header">
        <div>
            <p class="eyebrow">Online Appointment</p>
            <h1>Available Providers</h1>
            <p class="page-subtitle">
                Choose a provider to view available appointment slots.
            </p>
        </div>

        <a href="/categories.html" class="back-button">← Categories</a>
    </div>

    <div id="providerContainer" class="card-grid">
        <div class="glass-card">
            <p>Loading providers...</p>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    const container = document.getElementById("providerContainer");

    const categoryId =
        localStorage.getItem("selectedCategoryId");

    try {

        const response = await fetch("/api/providers");

        if (!response.ok) {
            throw new Error("Failed to load providers");
        }

        const providers = await response.json();

        container.innerHTML = "";

        const filteredProviders = categoryId
            ? providers.filter(
                provider =>
                    String(provider.categoryId) === String(categoryId)
              )
            : providers;

        if (filteredProviders.length === 0) {

            container.innerHTML = `
                <div class="glass-card">
                    <h2>No providers available</h2>
                    <p>Please choose another category.</p>
                </div>
            `;

            return;
        }

        filteredProviders.forEach(function (provider) {

            const card = document.createElement("div");

            card.className = "glass-card provider-card";

            card.innerHTML = `
                <div class="provider-icon">👤</div>

                <h2>${provider.name}</h2>

                <p><strong>${provider.profession}</strong></p>

                <p>${provider.organization}</p>

                <button
                    class="glass-button"
                    onclick="viewProvider(${provider.id})">
                    View Available Slots
                </button>
            `;

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="glass-card">
                <h2>Unable to load providers</h2>
                <p>Please make sure the Spring Boot server is running.</p>
            </div>
        `;
    }
});

function viewProvider(providerId) {

    localStorage.setItem(
        "selectedProviderId",
        providerId
    );

    window.location.href = "/appointments.html";
}
</script>

</body>
</html>
