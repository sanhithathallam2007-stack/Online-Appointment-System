spring.application.name=online-appointment-system

spring.datasource.url=jdbc:mysql://localhost:3306/appointment_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5175,http://192.0.0.2:5173
