<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Provider Dashboard</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


<div class="app-page">


    <!-- PAGE HEADER -->

    <div class="page-header">

        <p class="eyebrow">
            Provider Dashboard
        </p>

        <h1>
            Manage Appointments
        </h1>

        <p class="page-subtitle">
            View and manage appointments booked
            with you.
        </p>


        <!-- ADD SCHEDULE BUTTON -->

        <a
            href="/add-schedule.html"
            class="glass-button">

            + Add Appointment Slot

        </a>


        <br>


        <!-- LOGOUT BUTTON -->

        <a
            href="/provider-login.html"
            class="back-button"
            onclick="logoutProvider()">

            Logout

        </a>

    </div>



    <!-- PROVIDER INFORMATION -->

    <div
        id="providerInfo"
        class="glass-card"
        style="
            padding: 25px;
            margin-bottom: 30px;
        ">

        Loading provider information...

    </div>



    <!-- APPOINTMENTS -->

    <div
        id="appointmentContainer"
        class="card-grid">

        <div class="glass-card">

            <p>
                Loading appointments...
            </p>

        </div>

    </div>


</div>



<script>


document.addEventListener(
    "DOMContentLoaded",
    async function () {


        /*
         * GET LOGGED-IN PROVIDER
         */

        const provider =
            JSON.parse(
                localStorage.getItem(
                    "loggedInProvider"
                )
            );


        /*
         * IF PROVIDER IS NOT LOGGED IN
         */

        if (!provider) {

            window.location.href =
                "/provider-login.html";

            return;

        }



        /*
         * PROVIDER INFORMATION
         */

        const providerInfo =
            document.getElementById(
                "providerInfo"
            );


        providerInfo.innerHTML = `

            <h2>
                Welcome, ${provider.name}
            </h2>

            <p>
                <strong>
                    Profession:
                </strong>

                ${provider.profession}

            </p>

            <p>
                <strong>
                    Organization:
                </strong>

                ${provider.organization}

            </p>

            <p>
                <strong>
                    Email:
                </strong>

                ${provider.email}

            </p>

        `;



        /*
         * APPOINTMENT CONTAINER
         */

        const container =
            document.getElementById(
                "appointmentContainer"
            );



        try {


            /*
             * GET ALL APPOINTMENTS
             */

            const response =
                await fetch(
                    "/api/appointments"
                );


            if (!response.ok) {

                throw new Error(
                    "Failed to load appointments"
                );

            }



            const appointments =
                await response.json();



            /*
             * SHOW ONLY THIS PROVIDER'S
             * APPOINTMENTS
             */

            const providerAppointments =
                appointments.filter(
                    function (appointment) {

                        return (

                            appointment.provider &&

                            String(
                                appointment.provider.id
                            ) ===

                            String(
                                provider.id
                            )

                        );

                    }
                );



            /*
             * CLEAR LOADING MESSAGE
             */

            container.innerHTML = "";



            /*
             * NO APPOINTMENTS
             */

            if (
                providerAppointments.length === 0
            ) {

                container.innerHTML = `

                    <div class="glass-card">

                        <div class="category-icon">
                            📅
                        </div>

                        <h2>
                            No appointments
                        </h2>

                        <p>
                            No users have booked
                            an appointment with you yet.
                        </p>

                    </div>

                `;

                return;

            }



            /*
             * DISPLAY APPOINTMENTS
             */

            providerAppointments.forEach(
                function (appointment) {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "glass-card appointment-card";



                    /*
                     * ACTION BUTTONS
                     */

                    let actionButtons = "";



                    /*
                     * PENDING
                     */

                    if (
                        appointment.status ===
                        "PENDING"
                    ) {

                        actionButtons = `

                            <button
                                class="glass-button"
                                style="flex: 1;"
                                onclick="approveAppointment(${appointment.id})">

                                Approve

                            </button>


                            <button
                                class="glass-button"
                                style="flex: 1;"
                                onclick="rejectAppointment(${appointment.id})">

                                Reject

                            </button>

                        `;

                    }



                    /*
                     * APPROVED
                     */

                    if (
                        appointment.status ===
                        "APPROVED"
                    ) {

                        actionButtons = `

                            <button
                                class="glass-button"
                                style="width: 100%;"
                                onclick="completeAppointment(${appointment.id})">

                                Mark as Completed

                            </button>

                        `;

                    }



                    /*
                     * COMPLETED
                     *
                     * No button
                     */

                    if (
                        appointment.status ===
                        "COMPLETED"
                    ) {

                        actionButtons = "";

                    }



                    /*
                     * REJECTED
                     *
                     * No button
                     */

                    if (
                        appointment.status ===
                        "REJECTED"
                    ) {

                        actionButtons = "";

                    }



                    /*
                     * CANCELLED
                     *
                     * No button
                     */

                    if (
                        appointment.status ===
                        "CANCELLED"
                    ) {

                        actionButtons = "";

                    }



                    /*
                     * APPOINTMENT CARD
                     */

                    card.innerHTML = `

                        <div class="category-icon">
                            📅
                        </div>


                        <h2>
                            Appointment #${appointment.id}
                        </h2>


                        <p>

                            <strong>
                                Customer:
                            </strong>

                            ${appointment.user.name}

                        </p>


                        <p>

                            <strong>
                                Email:
                            </strong>

                            ${appointment.user.email}

                        </p>


                        <p>

                            <strong>
                                Date:
                            </strong>

                            ${appointment.appointmentDate}

                        </p>


                        <p class="appointment-time">

                            ${appointment.appointmentTime}

                        </p>


                        <p>

                            <strong>
                                Status:
                            </strong>

                            ${appointment.status}

                        </p>


                        <div
                            style="
                                display: flex;
                                gap: 10px;
                                width: 100%;
                                flex-wrap: wrap;
                                margin-top: 10px;
                            ">

                            ${actionButtons}

                        </div>

                    `;



                    container.appendChild(
                        card
                    );


                }
            );


        }


        catch (error) {


            console.error(
                "Dashboard error:",
                error
            );


            container.innerHTML = `

                <div class="glass-card">

                    <h2>
                        Unable to load appointments
                    </h2>

                    <p>
                        Please make sure the
                        Spring Boot server is running.
                    </p>

                </div>

            `;

        }

    }
);




/*
 * PROVIDER LOGOUT
 */

function logoutProvider() {

    localStorage.removeItem(
        "loggedInProvider"
    );

}




/*
 * APPROVE APPOINTMENT
 */

async function approveAppointment(
    appointmentId
) {


    try {


        const response =
            await fetch(
                "/api/appointments/" +
                appointmentId +
                "/approve",
                {
                    method: "PUT"
                }
            );


        const message =
            await response.text();



        if (response.ok) {


            alert(
                "Appointment approved successfully!"
            );


            window.location.reload();


        }


        else {


            alert(
                message ||
                "Unable to approve appointment."
            );


        }


    }


    catch (error) {


        console.error(error);


        alert(
            "Unable to connect to Spring Boot server."
        );


    }

}




/*
 * REJECT APPOINTMENT
 */

async function rejectAppointment(
    appointmentId
) {


    const confirmed =
        confirm(
            "Are you sure you want to reject this appointment?"
        );


    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(
                "/api/appointments/" +
                appointmentId +
                "/reject",
                {
                    method: "PUT"
                }
            );


        const message =
            await response.text();



        if (response.ok) {


            alert(
                "Appointment rejected successfully!"
            );


            window.location.reload();


        }


        else {


            alert(
                message ||
                "Unable to reject appointment."
            );


        }


    }


    catch (error) {


        console.error(error);


        alert(
            "Unable to connect to Spring Boot server."
        );


    }

}




/*
 * COMPLETE APPOINTMENT
 */

async function completeAppointment(
    appointmentId
) {


    const confirmed =
        confirm(
            "Mark this appointment as completed?"
        );


    if (!confirmed) {

        return;

    }



    try {


        const response =
            await fetch(
                "/api/appointments/" +
                appointmentId +
                "/complete",
                {
                    method: "PUT"
                }
            );


        const message =
            await response.text();



        if (response.ok) {


            alert(
                "Appointment completed successfully!"
            );


            window.location.reload();


        }


        else {


            alert(
                message ||
                "Unable to complete appointment."
            );


        }


    }


    catch (error) {


        console.error(error);


        alert(
            "Unable to connect to Spring Boot server."
        );


    }

}


</script>


</body>

</html>
