<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Available Slots - Online Appointment</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


<div class="app-page">


    <div class="page-header">

        <div>

            <p class="eyebrow">
                Online Appointment
            </p>

            <h1>
                Available Appointment Slots
            </h1>

            <p class="page-subtitle">
                Choose a date and time to book your appointment.
            </p>

        </div>


        <a
            href="/providers.html"
            class="back-button">

            ← Providers

        </a>

    </div>



    <!-- PROVIDER INFORMATION -->

    <div
        id="providerInfo"
        class="glass-card"
        style="margin-bottom: 30px;">

        Loading provider information...

    </div>



    <!-- AVAILABLE SLOTS -->

    <div
        id="slotContainer"
        class="card-grid">

        <div class="glass-card">

            <p>
                Loading available slots...
            </p>

        </div>

    </div>


</div>



<script>


document.addEventListener(
    "DOMContentLoaded",
    loadProviderAndSlots
);



async function loadProviderAndSlots() {


    /*
     * GET SELECTED PROVIDER
     */

    const providerId =
        localStorage.getItem(
            "selectedProviderId"
        );


    const providerInfo =
        document.getElementById(
            "providerInfo"
        );


    const slotContainer =
        document.getElementById(
            "slotContainer"
        );



    /*
     * CHECK PROVIDER
     */

    if (!providerId) {

        providerInfo.innerHTML = `

            <h2>
                Provider not selected
            </h2>

            <p>
                Please go back and select a provider.
            </p>

            <a
                href="/providers.html"
                class="glass-button">

                Select Provider

            </a>

        `;

        slotContainer.innerHTML = "";

        return;

    }



    try {


        /*
         * GET PROVIDER
         */

        const providerResponse =
            await fetch(
                "/api/providers/" +
                providerId
            );


        if (!providerResponse.ok) {

            throw new Error(
                "Failed to load provider"
            );

        }


        const provider =
            await providerResponse.json();



        /*
         * SHOW PROVIDER INFORMATION
         */

        providerInfo.innerHTML = `

            <div class="provider-icon">
                👤
            </div>

            <h2>
                ${provider.name}
            </h2>

            <p>
                <strong>
                    Profession:
                </strong>

                ${provider.profession}

            </p>

            <p>
                <strong>
                    Organization:
                </strong>

                ${provider.organization}

            </p>

        `;



        /*
         * GET PROVIDER SCHEDULES
         */

        const scheduleResponse =
            await fetch(
                "/api/schedules/provider/" +
                providerId
            );


        if (!scheduleResponse.ok) {

            throw new Error(
                "Failed to load schedules"
            );

        }


        const schedules =
            await scheduleResponse.json();



        /*
         * SHOW ONLY AVAILABLE SLOTS
         */

        const availableSchedules =
            schedules.filter(
                function (schedule) {

                    return schedule.available === true;

                }
            );



        slotContainer.innerHTML = "";



        /*
         * NO AVAILABLE SLOTS
         */

        if (
            availableSchedules.length === 0
        ) {

            slotContainer.innerHTML = `

                <div class="glass-card">

                    <div class="category-icon">
                        📅
                    </div>

                    <h2>
                        No available slots
                    </h2>

                    <p>
                        This provider currently has
                        no available appointment slots.
                    </p>

                    <a
                        href="/providers.html"
                        class="glass-button">

                        Choose Another Provider

                    </a>

                </div>

            `;

            return;

        }



        /*
         * DISPLAY AVAILABLE SLOTS
         */

        availableSchedules.forEach(
            function (schedule) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "glass-card appointment-card";



                card.innerHTML = `

                    <div class="category-icon">
                        📅
                    </div>


                    <h2>
                        Available Slot
                    </h2>


                    <p>

                        <strong>
                            Date:
                        </strong>

                        ${schedule.appointmentDate}

                    </p>


                    <p class="appointment-time">

                        ${schedule.appointmentTime}

                    </p>


                    <button
                        class="glass-button"
                        onclick="bookAppointment(${schedule.id})">

                        Book Appointment

                    </button>

                `;


                slotContainer.appendChild(
                    card
                );

            }
        );


    }


    catch (error) {


        console.error(error);


        providerInfo.innerHTML = `

            <div class="glass-card">

                <h2>
                    Unable to load provider
                </h2>

            </div>

        `;


        slotContainer.innerHTML = `

            <div class="glass-card">

                <h2>
                    Unable to load available slots
                </h2>

                <p>
                    Please make sure the
                    Spring Boot server is running.
                </p>

            </div>

        `;

    }

}




/*
 * BOOK APPOINTMENT
 */

async function bookAppointment(
    scheduleId
) {


    /*
     * GET LOGGED-IN USER
     */

    const loggedInUser =
        JSON.parse(
            localStorage.getItem(
                "loggedInUser"
            )
        );


    /*
     * GET PROVIDER
     */

    const providerId =
        localStorage.getItem(
            "selectedProviderId"
        );



    /*
     * LOGIN REQUIRED
     */

    if (!loggedInUser) {

        alert(
            "Please login before booking an appointment."
        );


        window.location.href =
            "/login.html";


        return;

    }



    /*
     * PROVIDER REQUIRED
     */

    if (!providerId) {

        alert(
            "Provider not selected."
        );


        window.location.href =
            "/providers.html";


        return;

    }



    /*
     * CONFIRM BOOKING
     */

    const confirmed =
        confirm(
            "Do you want to book this appointment?"
        );


    if (!confirmed) {

        return;

    }



    try {


        /*
         * BOOK APPOINTMENT
         */

        const response =
            await fetch(
                "/api/appointments/book" +
                "?userId=" +
                loggedInUser.id +
                "&providerId=" +
                providerId +
                "&scheduleId=" +
                scheduleId,
                {
                    method: "POST"
                }
            );



        const message =
            await response.text();



        /*
         * SUCCESS
         */

        if (response.ok) {


            alert(
                "Appointment booked successfully!"
            );


            window.location.href =
                "/my-appointments.html";


        }


        /*
         * ERROR
         */

        else {


            alert(
                message ||
                "Unable to book appointment."
            );


            loadProviderAndSlots();

        }


    }


    catch (error) {


        console.error(error);


        alert(
            "Unable to connect to Spring Boot server."
        );

    }

}


</script>


</body>

</html>
