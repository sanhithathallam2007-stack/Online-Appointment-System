<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Online Appointment</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="app-page">

    <div class="page-header">
        <div>
            <p class="eyebrow">Online Appointment</p>
            <h1>Choose a Category</h1>
            <p class="page-subtitle">
                Select a category to find available appointment providers.
            </p>
        </div>

        <a href="/index.html" class="back-button">← Home</a>
    </div>

    <div id="categoryContainer" class="card-grid">
        <div class="glass-card">
            <p>Loading categories...</p>
        </div>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", async function () {

    const container = document.getElementById("categoryContainer");

    try {

        const response = await fetch("/api/categories");

        if (!response.ok) {
            throw new Error("Failed to load categories");
        }

        const categories = await response.json();

        container.innerHTML = "";

        if (categories.length === 0) {
            container.innerHTML = `
                <div class="glass-card">
                    <p>No categories available.</p>
                </div>
            `;
            return;
        }

        categories.forEach(function (category) {

            const card = document.createElement("div");

            card.className = "glass-card category-card";

            card.innerHTML = `
                <div class="category-icon">📅</div>

                <h2>${category.name}</h2>

                <p>${category.description || "Book an appointment in this category."}</p>

                <button
                    class="glass-button"
                    onclick="openCategory(${category.id})">
                    View Providers
                </button>
            `;

            container.appendChild(card);
        });

    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="glass-card">
                <h2>Unable to load categories</h2>
                <p>Please make sure the Spring Boot server is running.</p>
            </div>
        `;
    }
});

function openCategory(categoryId) {

    localStorage.setItem("selectedCategoryId", categoryId);

    window.location.href = "/providers.html";
}
</script>

</body>
</html>
