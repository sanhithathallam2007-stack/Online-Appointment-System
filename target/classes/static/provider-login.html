<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Provider Login</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


<div class="auth-page">


    <div class="glass-card auth-card">


        <div class="auth-icon">
            👨‍⚕️
        </div>


        <h1>
            Provider Login
        </h1>


        <p class="auth-subtitle">
            Login to manage your appointments
        </p>


        <form id="providerLoginForm">


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter provider email"
                    required>

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required>

            </div>


            <button
                type="submit"
                class="glass-button">

                Login

            </button>


        </form>


        <p class="auth-footer">

            <a href="/index.html">
                ← Back to Home
            </a>

        </p>


    </div>


</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const form =
            document.getElementById(
                "providerLoginForm"
            );


        form.addEventListener(
            "submit",
            async function (event) {


                event.preventDefault();


                const email =
                    document.getElementById(
                        "email"
                    ).value.trim();


                const password =
                    document.getElementById(
                        "password"
                    ).value;


                try {


                    const response =
                        await fetch(
                            "/api/provider-auth/login",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    email: email,
                                    password: password
                                })
                            }
                        );


                    if (response.ok) {


                        const provider =
                            await response.json();


                        localStorage.setItem(
                            "loggedInProvider",
                            JSON.stringify(provider)
                        );


                        alert(
                            "Provider login successful!"
                        );


                        window.location.href =
                            "/provider-dashboard.html";


                    } else {


                        const message =
                            await response.text();


                        alert(
                            message ||
                            "Invalid provider email or password."
                        );

                    }


                } catch (error) {


                    console.error(
                        "Provider login error:",
                        error
                    );


                    alert(
                        "Cannot connect to Spring Boot server."
                    );

                }

            }
        );

    }
);

</script>


</body>

</html>
