<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Appointments</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="app-page">

    <div class="page-header">

        <p class="eyebrow">
            Online Appointment
        </p>

        <h1>
            My Appointments
        </h1>

        <p class="page-subtitle">
            View and manage your appointments.
        </p>

        <a
            href="/index.html"
            class="back-button">

            ← Home

        </a>

    </div>


    <div
        id="appointmentContainer"
        class="card-grid">

        <div class="glass-card">

            <p>
                Loading appointments...
            </p>

        </div>

    </div>

</div>


<script>


document.addEventListener(
    "DOMContentLoaded",
    loadAppointments
);



async function loadAppointments() {

    const container =
        document.getElementById(
            "appointmentContainer"
        );


    const loggedInUser =
        JSON.parse(
            localStorage.getItem(
                "loggedInUser"
            )
        );


    if (!loggedInUser) {

        container.innerHTML = `

            <div class="glass-card">

                <h2>
                    Login required
                </h2>

                <p>
                    Please login to view
                    your appointments.
                </p>

                <a
                    href="/login.html"
                    class="glass-button">

                    Login

                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                "/api/appointments/user/" +
                loggedInUser.id
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load appointments"
            );

        }


        const appointments =
            await response.json();


        container.innerHTML = "";


        if (appointments.length === 0) {

            container.innerHTML = `

                <div class="glass-card">

                    <div class="category-icon">
                        📅
                    </div>

                    <h2>
                        No appointments yet
                    </h2>

                    <p>
                        You haven't booked
                        any appointments.
                    </p>

                    <a
                        href="/categories.html"
                        class="glass-button">

                        Book Appointment

                    </a>

                </div>

            `;

            return;
        }


        appointments.forEach(
            function (appointment) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "glass-card appointment-card";


                let buttons = "";


                /*
                 * PENDING
                 * User can cancel or reschedule.
                 */
                if (
                    appointment.status ===
                    "PENDING"
                ) {

                    buttons += `

                        <button
                            class="glass-button"
                            onclick="cancelAppointment(${appointment.id})">

                            Cancel Appointment

                        </button>


                        <button
                            class="glass-button"
                            onclick="openReschedule(${appointment.id}, ${appointment.provider.id})">

                            Reschedule

                        </button>

                    `;

                }


                /*
                 * APPROVED
                 * User can cancel or reschedule.
                 */
                if (
                    appointment.status ===
                    "APPROVED"
                ) {

                    buttons += `

                        <button
                            class="glass-button"
                            onclick="cancelAppointment(${appointment.id})">

                            Cancel Appointment

                        </button>


                        <button
                            class="glass-button"
                            onclick="openReschedule(${appointment.id}, ${appointment.provider.id})">

                            Reschedule

                        </button>

                    `;

                }


                /*
                 * REJECTED
                 * No buttons.
                 */
                if (
                    appointment.status ===
                    "REJECTED"
                ) {

                    buttons = "";

                }


                /*
                 * CANCELLED
                 * No buttons.
                 */
                if (
                    appointment.status ===
                    "CANCELLED"
                ) {

                    buttons = "";

                }


                /*
                 * COMPLETED
                 * No buttons.
                 */
                if (
                    appointment.status ===
                    "COMPLETED"
                ) {

                    buttons = "";

                }


                card.innerHTML = `

                    <div class="category-icon">
                        📅
                    </div>


                    <h2>
                        Appointment #${appointment.id}
                    </h2>


                    <p>
                        <strong>
                            Date:
                        </strong>

                        ${appointment.appointmentDate}

                    </p>


                    <p class="appointment-time">

                        ${appointment.appointmentTime}

                    </p>


                    <p>

                        <strong>
                            Status:
                        </strong>

                        ${appointment.status}

                    </p>


                    ${buttons}

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="glass-card">

                <h2>
                    Unable to load appointments
                </h2>

                <p>
                    Please make sure the
                    Spring Boot server is running.
                </p>

                <button
                    class="glass-button"
                    onclick="loadAppointments()">

                    Try Again

                </button>

            </div>

        `;

    }

}



async function cancelAppointment(
    appointmentId
) {

    const confirmed =
        confirm(
            "Are you sure you want to cancel this appointment?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                "/api/appointments/" +
                appointmentId +
                "/cancel",
                {
                    method: "PUT"
                }
            );


        const message =
            await response.text();


        if (response.ok) {

            alert(
                "Appointment cancelled successfully!"
            );

            loadAppointments();

        } else {

            alert(
                message ||
                "Unable to cancel appointment."
            );

        }


    } catch (error) {

        console.error(error);

        alert(
            "Unable to connect to Spring Boot server."
        );

    }

}



function openReschedule(
    appointmentId,
    providerId
) {

    localStorage.setItem(
        "rescheduleAppointmentId",
        appointmentId
    );


    localStorage.setItem(
        "rescheduleProviderId",
        providerId
    );


    window.location.href =
        "/reschedule.html";

}


</script>


</body>

</html>
