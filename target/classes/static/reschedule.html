<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reschedule Appointment</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="app-page">

    <div class="page-header">

        <p class="eyebrow">
            Online Appointment
        </p>

        <h1>
            Reschedule Appointment
        </h1>

        <p class="page-subtitle">
            Select a new available time slot.
        </p>

        <a
            href="/my-appointments.html"
            class="back-button">

            ← My Appointments

        </a>

    </div>


    <div
        id="scheduleContainer"
        class="card-grid">

        <div class="glass-card">

            <p>
                Loading available slots...
            </p>

        </div>

    </div>

</div>


<script>

document.addEventListener(
    "DOMContentLoaded",
    loadSchedules
);


async function loadSchedules() {

    const container =
        document.getElementById(
            "scheduleContainer"
        );


    const appointmentId =
        localStorage.getItem(
            "rescheduleAppointmentId"
        );


    const providerId =
        localStorage.getItem(
            "rescheduleProviderId"
        );


    // Check required information
    if (!appointmentId || !providerId) {

        container.innerHTML = `

            <div class="glass-card">

                <h2>
                    Reschedule information missing
                </h2>

                <p>
                    Please go back to My Appointments
                    and select Reschedule again.
                </p>

                <a
                    href="/my-appointments.html"
                    class="glass-button">

                    My Appointments

                </a>

            </div>

        `;

        return;
    }


    try {

        const response =
            await fetch(
                "/api/schedules/provider/" +
                providerId
            );


        if (!response.ok) {

            throw new Error(
                "Failed to load schedules"
            );

        }


        const schedules =
            await response.json();


        // Only show available slots
        const availableSchedules =
            schedules.filter(
                function (schedule) {

                    return schedule.available === true;

                }
            );


        container.innerHTML = "";


        if (availableSchedules.length === 0) {

            container.innerHTML = `

                <div class="glass-card">

                    <div class="category-icon">
                        📅
                    </div>

                    <h2>
                        No available slots
                    </h2>

                    <p>
                        There are currently no
                        available slots for this provider.
                    </p>

                    <a
                        href="/my-appointments.html"
                        class="glass-button">

                        Back to Appointments

                    </a>

                </div>

            `;

            return;
        }


        // Display available slots
        availableSchedules.forEach(
            function (schedule) {


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "glass-card appointment-card";


                card.innerHTML = `

                    <div class="category-icon">
                        📅
                    </div>


                    <h2>
                        ${schedule.appointmentDate}
                    </h2>


                    <p class="appointment-time">

                        ${schedule.appointmentTime}

                    </p>


                    <p>
                        Available
                    </p>


                    <button
                        class="glass-button"
                        onclick="rescheduleAppointment(${schedule.id})">

                        Select This Slot

                    </button>

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Reschedule error:",
            error
        );


        container.innerHTML = `

            <div class="glass-card">

                <h2>
                    Unable to load slots
                </h2>

                <p>
                    Please make sure the Spring Boot
                    server is running.
                </p>

                <button
                    class="glass-button"
                    onclick="loadSchedules()">

                    Try Again

                </button>

            </div>

        `;

    }

}



async function rescheduleAppointment(
    scheduleId
) {

    const appointmentId =
        localStorage.getItem(
            "rescheduleAppointmentId"
        );


    if (!appointmentId) {

        alert(
            "Appointment information is missing."
        );

        return;

    }


    const confirmed =
        confirm(
            "Do you want to reschedule to this slot?"
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/appointments/${appointmentId}/reschedule` +
                `?scheduleId=${scheduleId}`,
                {
                    method: "PUT"
                }
            );


        const message =
            await response.text();


        if (response.ok) {

            alert(
                "Appointment rescheduled successfully!"
            );


            localStorage.removeItem(
                "rescheduleAppointmentId"
            );


            localStorage.removeItem(
                "rescheduleProviderId"
            );


            window.location.href =
                "/my-appointments.html";

        } else {

            alert(
                message ||
                "Unable to reschedule appointment."
            );

        }


    } catch (error) {

        console.error(
            "Reschedule error:",
            error
        );


        alert(
            "Unable to connect to Spring Boot server."
        );

    }

}

</script>

</body>

</html>
